# Deploys the Ember heater app (heater/) to the Cloudflare Pages project "hcaloryapp"
# whenever it changes. Needs one repository secret: CLOUDFLARE_API_TOKEN
# (Account → Cloudflare Pages → Edit). The account ID is a public identifier.
name: Deploy Ember to Cloudflare Pages

on:
  push:
    branches: [main, claude/funny-hypatia-5cjonk]
    paths: ["heater/**", ".github/workflows/deploy-ember.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-ember
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the app files
        run: |
          mkdir dist
          cd heater
          cp index.html style.css app.js protocol.js govee.js sw.js manifest.webmanifest icon.svg icon-512.png _worker.js ../dist/
          grep -o 'const VERSION = "[^"]*"' app.js

      - name: Deploy to Cloudflare Pages (hcaloryapp)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dbc1a63a0afdaba48d4bcc0739c8c4c5
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to enable deploys."
            exit 0
          fi
          npx --yes wrangler@4.153.0 pages deploy dist --project-name hcaloryapp --branch main --commit-dirty=true
